name: Pull request labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply approved path labels
    if: vars.ENABLE_PATH_LABELER == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from the trusted base branch configuration
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

# This workflow intentionally does not check out or execute pull-request code.
# Enable only after manually creating each configured label in repository settings.
