name: Secret detection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  gitleaks:
    name: Detect committed credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect secrets with redacted output
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # verified 2026-08-23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
