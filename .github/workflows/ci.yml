name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx scikit-learn pandas scipy pyyaml joblib
      - name: Lint
        run: python -m pip install ruff && ruff check src scripts tests
      - name: Compile Python
        run: python -m compileall -q src scripts
      - name: Source audit
        run: python scripts/source_audit.py --root .
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag fake-news-detection:ci .
