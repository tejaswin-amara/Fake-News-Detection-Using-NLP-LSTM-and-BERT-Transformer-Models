name: CI/CD Pipeline - Quality, Testing, Security & Container Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gate (Biome, TypeScript, Ruff)
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Run Biome linter and formatter check
        run: pnpm --prefix frontend check

      - name: Run TypeScript compiler check
        run: pnpm --prefix frontend tsc --noEmit

      - name: Validate OpenAPI 3.1 contract with Spectral
        run: pnpm --prefix frontend exec spectral lint ../backend/openapi.json --ruleset ../backend/.spectral.yaml

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev

      - name: Run Ruff linter and format check
        run: |
          uv run --project backend ruff check backend/
          uv run --project backend ruff format --check backend/

  # ---------------------------------------------------------------------------
  # 2. Unit & Integration Testing (Vitest & Pytest)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Run Vitest frontend test suite
        run: pnpm --prefix frontend test --run

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev

      - name: Run Pytest backend test suite with coverage
        run: uv run --project backend pytest backend/

  # ---------------------------------------------------------------------------
  # 3. End-to-End Automation Testing (Playwright Cross-Browser)
  # ---------------------------------------------------------------------------
  test-e2e:
    name: Playwright E2E & Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install Playwright browsers and dependencies
        run: pnpm --prefix frontend exec playwright install --with-deps

      - name: Run Playwright cross-browser E2E and WCAG 2.1 AA Accessibility tests
        run: pnpm --prefix frontend test:e2e

      - name: Upload Playwright test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. DevSecOps Security Gate (Gitleaks Secrets & Semgrep SAST)
  # ---------------------------------------------------------------------------
  security-sast:
    name: Security SAST & Secrets Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST analysis
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep:latest \
            semgrep scan --config auto --error /src/frontend/src /src/backend/app
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 5. Containerization Security & Verification (Docker & Trivy)
  # ---------------------------------------------------------------------------
  container-security:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose definitions
        run: docker compose config

      - name: Build frontend container image
        run: docker build -t fake-news-frontend:test -f frontend/Dockerfile frontend/

      - name: Build backend container image
        run: docker build -t fake-news-backend:test -f backend/Dockerfile backend/

      - name: Scan frontend image for CVEs with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "fake-news-frontend:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan backend image for CVEs with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "fake-news-backend:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
