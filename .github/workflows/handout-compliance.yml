name: handout-compliance

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: handout-compliance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  implementation-gate:
    name: 25SC2107E implementation compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run handout compliance audit
        run: python scripts/handout_compliance_audit.py --root . --output reports/handout_compliance_audit.json
      - name: Compile compliance surfaces
        run: python -m compileall -q src scripts tests
      - name: Run handout-model regression tests
        run: python -m pytest -q tests/test_handout_models.py
      - name: Upload compliance evidence
        uses: actions/upload-artifact@v4
        with:
          name: handout-compliance-evidence
          path: reports/handout_compliance_audit.json
