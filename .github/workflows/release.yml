name: Semantic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create semantic version and GitHub release
    if: vars.ENABLE_SEMANTIC_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create a versioned GitHub release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          build: "false"

# Activation is deliberately explicit. Before setting ENABLE_SEMANTIC_RELEASE=true,
# protect main with the required CI status checks and configure write-capable GitHub
# Actions permissions or a scoped SEMANTIC_RELEASE_TOKEN. Conventional Commit
# prefixes determine whether a qualifying main-branch change releases.
