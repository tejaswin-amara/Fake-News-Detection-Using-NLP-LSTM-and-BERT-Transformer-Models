name: Semantic release

on:
  workflow_run:
    workflows: ["fake-news-detection-ci"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create semantic version and GitHub release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.ENABLE_SEMANTIC_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the CI-validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create a versioned GitHub release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          build: "false"

# Activation is deliberately explicit. Before setting ENABLE_SEMANTIC_RELEASE=true,
# configure write-capable GitHub Actions permissions or a scoped SEMANTIC_RELEASE_TOKEN.
# Conventional Commit prefixes determine whether a qualifying main-branch change releases.
