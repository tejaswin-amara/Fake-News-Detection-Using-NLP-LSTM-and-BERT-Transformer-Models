name: bounded-parser-fuzzing

on:
  workflow_dispatch:
    inputs:
      duration-seconds:
        description: Maximum fuzz duration in seconds (1-60)
        required: false
        default: "60"
        type: string
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: read

concurrency:
  group: bounded-parser-fuzzing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claimreview-metadata:
    name: Fuzz bounded ClaimReview metadata parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install minimal complete hash-locked parser-fuzzing dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/fuzz-py311-manylinux_2_28.txt"

      - name: Run deterministic privacy-safe fuzz target
        env:
          INPUT_DURATION: ${{ inputs.duration-seconds || '60' }}
        run: |
          set -Eeuo pipefail
          case "$INPUT_DURATION" in
            ''|*[!0-9]*) echo "duration-seconds must be an integer between 1 and 60"; exit 2 ;;
          esac
          if [ "$INPUT_DURATION" -lt 1 ] || [ "$INPUT_DURATION" -gt 60 ]; then
            echo "duration-seconds must be an integer between 1 and 60"
            exit 2
          fi
          mkdir -p .fuzz-artifacts
          timeout "$((INPUT_DURATION + 5))s" python -m tests.fuzz.fuzz_text_parsing \
            --corpus fuzz/corpus/claimreview_metadata.json \
            --seed 20260822 \
            --cases 2048 \
            --duration-seconds "$INPUT_DURATION" \
            --artifact-dir .fuzz-artifacts

      - name: Upload redacted crash metadata
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bounded-parser-fuzzing-crash-metadata
          path: .fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 7
