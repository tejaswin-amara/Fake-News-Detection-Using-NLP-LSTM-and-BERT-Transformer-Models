[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection-ml"
version = "0.1.0"
description = "Handout-compliant fake news detection with NLP, classical ML, BiLSTM, and BERT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Project source license; see repository terms and dependency licenses"}
authors = [{name = "Manus AI"}]
dependencies = [
    "dvc==3.67.1",
    "ijson==3.5.1",
]

[project.optional-dependencies]
tracking = ["mlflow==3.15.1"]
dev = ["pytest==9.1.1", "pytest-cov==6.0.0", "ruff==0.16.4", "mypy==1.13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true
exclude = '(^|/)(notebooks|\.venv|build|dist)/'

# The scientific stack exposes incomplete typing at sklearn/LightGBM/TensorFlow
# boundaries. These compatibility overrides are limited to legacy adapters and
# fixture tests; hardened serving/monitoring/tracking/automation modules remain
# fully strict and are checked without overrides.
[[tool.mypy.overrides]]
module = [
    "src.data.*",
    "src.features.*",
    "src.models.*",
    "src.evaluation.*",
    "src.train",
    "src.evaluate",
    "scripts.export_onnx",
    "scripts.generate_reports",
    "tests.*",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "operator",
    "type-arg",
    "unreachable",
    "unused-ignore",
]
