[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detection-ml"
version = "0.1.0"
description = "Handout-compliant fake news detection with NLP, classical ML, BiLSTM, and BERT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Project source license; see repository terms and dependency licenses"}
authors = [{name = "Manus AI"}]
dependencies = [
    "dvc==3.58.0",
]

[project.optional-dependencies]
tracking = ["mlflow==2.17.2"]
dev = ["pytest==8.3.3", "pytest-cov==6.0.0", "ruff==0.7.4", "mypy==1.13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
