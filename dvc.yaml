stages:
  claimreview_current:
    cmd: >-
      python -m src.data.claimreview
      --config configs/dataset.yaml
      --refresh
    deps:
      - src/data/claimreview.py
      - src/data/ingestion.py
      - src/features/minhash.py
      - configs/dataset.yaml
      - docs/sources.yaml
    outs:
      - data/raw/claimreview_current/data.json
      - data/raw/claimreview_current/collection_manifest.json
      - data/processed/claimreview_current/master.csv
      - data/processed/claimreview_current/train.csv
      - data/processed/claimreview_current/validation.csv
      - data/processed/claimreview_current/test.csv
      - data/processed/claimreview_current/release_manifest.json

  ingest:
    cmd: >-
      python -m src.data.ingestion
      --dataset ${dvc.dataset}
      --path ${dvc.input_path}
      --output ${dvc.processed_path}
      --seed ${split.random_seed}
    deps:
      - src/data/ingestion.py
      - ${dvc.input_path}
    params:
      - dvc.dataset
      - dvc.input_path
      - dvc.processed_path
      - split.train_size
      - split.validation_size
      - split.test_size
      - split.random_seed
    outs:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/test.csv
      - data/processed/split_manifest.json

  train:
    cmd: >-
      python -m src.train
      --train data/processed/train.csv
      --validation data/processed/validation.csv
      --model ${dvc.model_name}
      --output ${dvc.model_artifact}
      --config configs/default.yaml
      --models-config configs/models.yaml
      --evaluation-config configs/evaluation.yaml
    deps:
      - src/train.py
      - src/features/text.py
      - src/models/classical.py
      - src/models/lstm.py
      - src/models/bert.py
      - src/models/unsupervised.py
      - src/features/unsupervised_features.py
      - src/serving/predictor.py
      - src/serving/export.py
      - data/processed/train.csv
      - data/processed/validation.csv
      - configs/default.yaml
      - configs/models.yaml
      - configs/evaluation.yaml
    params:
      - dvc.model_name
      - dvc.model_artifact
      - text.tfidf
      - models.classical
    outs:
      - ${dvc.model_artifact}

  evaluate:
    cmd: >-
      python -m src.evaluate
      --test data/processed/test.csv
      --artifact ${dvc.model_artifact}
      --output ${dvc.evaluation_report}
    deps:
      - src/evaluate.py
      - src/evaluation/metrics.py
      - data/processed/test.csv
      - ${dvc.model_artifact}
    params:
      - dvc.evaluation_report
      - evaluation.primary_metric
    metrics:
      - reports/dvc_evaluation.json:
          cache: false
