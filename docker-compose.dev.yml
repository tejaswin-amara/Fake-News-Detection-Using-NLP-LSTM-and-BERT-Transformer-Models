name: veritas-fake-news-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: veritas-backend:dev
    container_name: veritas-backend-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:rw
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - veritas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: veritas-frontend:dev
    container_name: veritas-frontend-dev
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veritas-net

networks:
  veritas-net:
    driver: bridge
