# Lefthook Git Quality Gate Configuration
# Runs Biome linter, TypeScript check, and Vitest test suite

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    test:
      run: pnpm test
