name: veritas-fake-news

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: veritas-backend:latest
    container_name: veritas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - veritas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: veritas-frontend:latest
    container_name: veritas-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veritas-net

networks:
  veritas-net:
    driver: bridge
