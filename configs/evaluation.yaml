split:
  train: 0.70
  validation: 0.15
  test: 0.15
  seed: 42

cross_validation:
  strategy: stratified_k_fold
  folds: 5
  inner_folds: 3
  outer_folds: 5
  shuffle: true
  random_state: 42
  nested: true

authored_test_policy:
  final_test_used_for_selection: false
  final_test_evaluated_once: true
  calibration_fit_on_test: false

search:
  methods: [grid, random, bayesian]
  default_method: grid
  scoring: average_precision
  random_iterations: 20
  bayesian_trials: 25

metrics:
  classification: [accuracy, precision, recall, f1_macro, f1_weighted, roc_auc, pr_auc, brier_score]
  regression: [rmse, mae, mape, r2]
  primary_metric: pr_auc
  threshold: 0.5
  calibration: [brier_score, reliability_diagram, platt_scaling, isotonic_regression]
  significance:
    mcnemar_alpha: 0.05
    bootstrap_iterations: 2000
    bootstrap_confidence_level: 0.95
    comparisons: [baseline_vs_bilstm, baseline_vs_bert, bilstm_vs_bert]

artifacts:
  directory: reports/evaluation
  benchmark_csv: reports/evaluation/benchmark.csv
  nested_cv_json: reports/evaluation/nested_cv.json
  search_json: reports/evaluation/search.json
  final_metrics_json: reports/evaluation/final_metrics.json
  reliability_png: reports/evaluation/reliability.png
  calibration_comparison_png: reports/evaluation/calibration_comparison.png
  roc_pr_png: reports/evaluation/roc_pr.png
  confusion_png: reports/evaluation/confusion_matrix.png
  learning_curve_png: reports/evaluation/learning_curve.png
  validation_curve_png: reports/evaluation/validation_curve.png
