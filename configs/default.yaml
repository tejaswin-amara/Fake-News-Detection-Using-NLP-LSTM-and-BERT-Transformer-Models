project:
  name: fake-news-detection-ml
  label_mapping:
    real: 0
    fake: 1
  random_seed: 42
  timezone: UTC

paths:
  raw_data: data/raw
  processed_data: data/processed
  external_data: data/external
  artifacts: artifacts
  reports: reports
  source_register: docs/sources.yaml

split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  stratify: true
  random_seed: 42
  near_duplicate_check: true

text:
  title_weight: 1.0
  body_weight: 1.0
  lowercase: true
  normalize_unicode: true
  remove_urls: true
  remove_email_addresses: true
  remove_html: true
  stop_words: optional
  lemmatize: optional
  max_characters: 50000
  tfidf:
    analyzer: word
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.98
    max_features: 200000
    sublinear_tf: true
  sequence:
    max_tokens: 30000
    max_length: 400
  transformer:
    model_name: google-bert/bert-base-uncased
    max_length: 512
    dynamic_padding: true

unsupervised:
  representation: tfidf
  pca_components: 50
  kmeans_k_values: [2, 3, 4, 5, 6, 8, 10]
  dbscan_eps_values: [0.20, 0.35, 0.50, 0.75]
  dbscan_min_samples_values: [5, 10, 20]
  tsne_perplexity: 30
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  isolation_forest_contamination: auto

models:
  classical:
    max_iter: 2000
    logistic_c_values: [0.1, 1.0, 10.0]
    tree_max_depth: [null, 10, 20]
    random_forest_estimators: 300
    random_forest_oob_score: true
  lstm:
    embedding_dim: 100
    embedding_trainable: false
    lstm_units: [128, 64]
    dropout: 0.30
    recurrent_dropout: 0.0
    batch_size: 64
    epochs: 10
    learning_rate: 0.001
  bert:
    model_name: google-bert/bert-base-uncased
    epochs: 3
    batch_size: 8
    learning_rate: 0.00002
    warmup_ratio: 0.10
    max_grad_norm: 1.0
    fp16: true


evaluation:
  cv_folds: 5
  scoring: average_precision
  primary_metric: pr_auc
  calibration_methods: [sigmoid, isotonic]
  confidence_level: 0.95
  mcnemar_alpha: 0.05

serving:
  host: 0.0.0.0
  port: 8000
  model_name: logistic_l2
  model_artifact: artifacts/models/logistic_l2.joblib
  max_batch_size: 64
  max_text_characters: 50000
  include_latency_header: true

monitoring:
  ks_alpha: 0.05
  psi_threshold: 0.20
  reference_artifact: artifacts/monitoring/reference_features.npz
  report_directory: reports/monitoring

tracking:
  enabled: false
  uri: mlruns
  experiment_name: fake-news-detection
