# Model-specific overrides; shared defaults remain in configs/default.yaml.
classical:
  logistic:
    penalties: [l1, l2, elasticnet]
    C_values: [0.1, 1.0, 10.0]
    max_iter: 2000
  decision_tree:
    criterion: [gini, entropy]
    ccp_alpha: [0.0, 0.0001, 0.001, 0.01]
  random_forest:
    n_estimators: [100, 300]
    max_depth: [null, 10, 20]
  xgboost:
    n_estimators: [100, 300]
    max_depth: [4, 6, 8]
  lightgbm:
    n_estimators: [100, 300]
    num_leaves: [15, 31, 63]

lstm:
  embedding_dimensions: [100, 300]
  epochs: [3, 5, 10]
  batch_sizes: [32, 64]

bert:
  model_name: google-bert/bert-base-uncased
  epochs: [3, 4, 5]
  learning_rates: [0.00001, 0.00002, 0.00005]
